# Отличия боевого сервера от машины разработчика.
#
# Применяется поверх основного файла:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# Что здесь меняется и почему:
#   * порты слушают только localhost — витрина и служебная база не нужны
#     всей внутренней сети, наружу их выставит nginx на третьем этапе;
#   * контейнеры поднимаются сами после перезагрузки сервера;
#   * данные лежат на /mnt/gfd_data: корневой раздел всего 124 ГБ,
#     и витрина забила бы его вместе с боевой базой.
#
# Контейнер имитации источника (pg_source) сюда не входит вовсе:
# на сервере источник — настоящая боевая база.

# Подсеть задана явно, чтобы в pg_hba боевой базы стояло точечное правило
# на этот диапазон, а не разрешение всему докеру скопом.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  clickhouse:
    # !override обязателен: без него Compose складывает списки портов из
    # обоих файлов, и получается два маппинга на один порт — сначала
    # 0.0.0.0 из базового, следом 127.0.0.1 отсюда. Второй падает
    # с «address already in use», причём порт при этом свободен.
    ports: !override
      - "127.0.0.1:${CH_PORT:-8123}:8123"
      - "127.0.0.1:9000:9000"
    restart: unless-stopped

  pg_app:
    ports: !override
      - "127.0.0.1:${PG_APP_PORT:-5433}:5432"
    restart: unless-stopped

# Данные лежат отдельно от кода. Каталог репозитория тоже называется
# gfd-bi и содержит папки clickhouse/ и pg_app/ с конфигами и init-скриптом:
# направь тома туда — и PostgreSQL откажется инициализироваться поверх
# непустого каталога, а ClickHouse свалит свои файлы вперемешку с исходниками.
volumes:
  ch_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/gfd_data/gfd-bi-data/clickhouse
  pg_app_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/gfd_data/gfd-bi-data/pg_app
