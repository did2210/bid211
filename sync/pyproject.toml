[project]
name = "gfd-sync"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "clickhouse-connect>=0.8",
    "pydantic-settings>=2.4",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "python-dotenv>=1.0"]

[project.scripts]
gfd-sync = "gfd_sync.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gfd_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ".." даёт тестам доступ к пакету tools в корне проекта
pythonpath = ["src", ".."]
markers = ["slow: замеры на большом объёме, запускать отдельно"]
# Замеры требуют наполненной витрины, поэтому в обычный прогон не входят.
addopts = "-m 'not slow'"
